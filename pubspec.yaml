name: notapplemusic
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Music player dependencies
  provider: ^6.0.5
  just_audio: ^0.10.5
